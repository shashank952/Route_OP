
<!DOCTYPE html>
<html>
<head>
    <title>Sales Route Optimizer - Retro Blue</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <h1>SALES ROUTE OPTIMIZER</h1>

    <div class="container">
        <div class="form-grid">
            <div class="form-item">
                <label>Source:</label>
                <select id="source"></select>
            </div>

            <div class="form-item">
                <label>Destination:</label>
                <select id="destination"></select>
            </div>

            <div class="form-item">
                <label>Passengers:</label>
                <input type="number" id="passengers" min="1" value="1">
            </div>

            <div class="form-item">
                <label>Fuel Available (liters):</label>
                <input type="number" id="fuel_available" min="0" value="10">
            </div>

            <div class="form-item">
                <label>Mileage (km/l):</label>
                <input type="number" id="mileage" value="-1">
            </div>

            <div class="form-item">
                <label>Vehicle Type:</label>
                <select id="vehicle_type">
                    <option value="Bike">Bike</option>
                    <option value="Car" selected>Car</option>
                    <option value="MiniVan">MiniVan</option>
                    <option value="SUV">SUV</option>
                    <option value="Pickup Truck">Pickup Truck</option>
                </select>
            </div>
        </div>

        <button class="btn" onclick="getRoute()">OPTIMIZE</button>

        <div id="result" class="route-container"></div>
    </div>

    <script>
        const places = {{ places|tojson }};
        const sourceSelect = document.getElementById("source");
        const destSelect = document.getElementById("destination");
        const resultDiv = document.getElementById("result");

        // Populate dropdowns
        places.forEach(p => {
            const o1 = document.createElement('option');
            o1.textContent = p; sourceSelect.appendChild(o1);
            const o2 = document.createElement('option');
            o2.textContent = p; destSelect.appendChild(o2);
        });

        async function getRoute() {
            const data = {
                source: sourceSelect.value,
                destination: destSelect.value,
                passengers: document.getElementById("passengers").value,
                fuel_available: document.getElementById("fuel_available").value,
                mileage: document.getElementById("mileage").value,
                vehicle_type: document.getElementById("vehicle_type").value
            };

            resultDiv.innerHTML = "<p class='info'>Calculating...</p>";

            const res = await fetch("/optimize", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const payload = await res.json();

            // Handle error first
            if (payload.error) {
                resultDiv.innerHTML = `<p class="error">${payload.error}</p>`;
                return;
            }

            const routes = payload.routes || [];
            if (!Array.isArray(routes) || routes.length === 0) {
                resultDiv.innerHTML = `<p class="error">No routes found</p>`;
                return;
            }

            // Build cards side-by-side
            resultDiv.innerHTML = routes.map((r, idx) => `
                <div class="route-block">
                    <h3>Route ${idx + 1}</h3>
                    <div class="path-block">
                        ${r.route.map((p, i) =>
                            i < r.route.length - 1
                                ? `<div class="stop">${p}</div><div class="arrow">↓</div>`
                                : `<div class="stop">${p}</div>`
                        ).join("")}
                    </div>

                    <div class="costs">
                        <p>Total Distance: <strong>${r.total_distance}</strong> km</p>
                        <p>Fuel Cost: ₹${r.fuel_cost.toFixed(2)}</p>
                        <p>Passenger Cost: ₹${r.passenger_cost.toFixed(2)}</p>
                        <p>Toll: ₹${r.toll.toFixed(2)}</p>
                        <p>Maintenance: ₹${r.maintenance.toFixed(2)}</p>
                        <p>Vehicle Cost: <strong>₹${r.vehicle_cost.toFixed(2)}</strong></p>
                        <p class="grand"><strong>Grand Total: ₹${r.total_cost.toFixed(2)}</strong></p>
                    </div>
                </div>
            `).join("");
        }
    </script>
</body>
</html>
